<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Article - AgriGenius</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .edit-form {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 2rem;
            box-shadow: var(--shadow-lg);
            border: 2px solid var(--border-color);
            transition: all 0.3s ease;
        }
        
        .edit-form:hover {
            border-color: var(--primary-green);
            box-shadow: var(--shadow-xl);
        }
        
        .form-control, .form-select {
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            transition: all 0.3s ease;
            background: var(--bg-primary);
        }
        
        .form-control:focus, .form-select:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1);
            background: var(--bg-primary);
        }
        
        .btn-primary {
            background: var(--gradient-primary);
            border: none;
            border-radius: var(--radius-md);
            padding: 0.75rem 2rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }
        
        .btn-secondary {
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            color: var(--text-primary);
            border-radius: var(--radius-md);
            padding: 0.75rem 2rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-secondary:hover {
            background: var(--border-color);
            transform: translateY(-2px);
        }
        
        .form-label {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }
        
        .char-counter {
            font-size: 0.875rem;
            color: var(--text-muted);
            text-align: right;
        }
        
        .char-counter.warning {
            color: #f59e0b;
        }
        
        .char-counter.danger {
            color: #ef4444;
        }
        
        .preview-section {
            background: var(--bg-secondary);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            margin-top: 1rem;
            border: 2px solid var(--border-color);
        }
        
        .preview-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 1rem;
        }
        
        .preview-content {
            color: var(--text-secondary);
            line-height: 1.6;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        
        .loading-overlay.show {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body>
    {% include 'navbar.html' %}
    
    <div class="container mt-4 animate-fadeInUp">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="edit-form">
                    <div class="d-flex align-items-center mb-4">
                        <i class="fas fa-edit text-primary me-2"></i>
                        <h2 class="mb-0">Edit Article</h2>
                    </div>
                    
                    <form method="POST" id="editForm">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                        <div class="mb-3">
                            <label for="title" class="form-label">Title</label>
                            <input type="text" class="form-control" id="title" name="title" value="{{ article.title }}" required maxlength="200">
                            <div class="char-counter" id="titleCounter">0/200</div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="category" class="form-label">Category</label>
                            <select class="form-select" id="category" name="category">
                                <option value="General" {% if article.category == 'General' %}selected{% endif %}>General</option>
                                <option value="Crops" {% if article.category == 'Crops' %}selected{% endif %}>Crops</option>
                                <option value="Soil" {% if article.category == 'Soil' %}selected{% endif %}>Soil</option>
                                <option value="Pests" {% if article.category == 'Pests' %}selected{% endif %}>Pests</option>
                                <option value="Technology" {% if article.category == 'Technology' %}selected{% endif %}>Technology</option>
                                <option value="Equipment" {% if article.category == 'Equipment' %}selected{% endif %}>Equipment</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label for="tags" class="form-label">Tags (comma-separated)</label>
                            <input type="text" class="form-control" id="tags" name="tags" value="{{ article.tags or '' }}" placeholder="e.g., irrigation, organic, sustainable">
                            <small class="form-text text-muted">Separate multiple tags with commas</small>
                        </div>
                        
                        <div class="mb-3">
                            <label for="content" class="form-label">Content</label>
                            <textarea class="form-control" id="content" name="content" rows="12" required>{{ article.content }}</textarea>
                            <div class="char-counter" id="contentCounter">0 characters</div>
                        </div>
                        
                        <!-- Preview Section -->
                        <div class="preview-section">
                            <h5 class="mb-3">
                                <i class="fas fa-eye me-2"></i>
                                Preview
                            </h5>
                            <div class="preview-title" id="previewTitle">{{ article.title }}</div>
                            <div class="preview-content" id="previewContent">{{ article.content }}</div>
                        </div>
                        
                        <div class="d-flex gap-3 mt-4">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-2"></i>
                                Update Article
                            </button>
                            <a href="/articles" class="btn btn-secondary">
                                <i class="fas fa-arrow-left me-2"></i>
                                Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="text-center text-white">
            <div class="loading-spinner mb-3"></div>
            <p>Updating article...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Character counters
        const titleInput = document.getElementById('title');
        const contentInput = document.getElementById('content');
        const titleCounter = document.getElementById('titleCounter');
        const contentCounter = document.getElementById('contentCounter');
        const previewTitle = document.getElementById('previewTitle');
        const previewContent = document.getElementById('previewContent');
        
        function updateTitleCounter() {
            const length = titleInput.value.length;
            titleCounter.textContent = `${length}/200`;
            titleCounter.className = 'char-counter';
            
            if (length > 180) {
                titleCounter.classList.add('warning');
            }
            if (length > 200) {
                titleCounter.classList.add('danger');
            }
        }
        
        function updateContentCounter() {
            const length = contentInput.value.length;
            contentCounter.textContent = `${length} characters`;
            contentCounter.className = 'char-counter';
            
            if (length > 1000) {
                contentCounter.classList.add('warning');
            }
            if (length > 2000) {
                contentCounter.classList.add('danger');
            }
        }
        
        function updatePreview() {
            previewTitle.textContent = titleInput.value || 'Your article title...';
            previewContent.textContent = contentInput.value || 'Your article content...';
        }
        
        // Event listeners
        titleInput.addEventListener('input', () => {
            updateTitleCounter();
            updatePreview();
        });
        
        contentInput.addEventListener('input', () => {
            updateContentCounter();
            updatePreview();
        });
        
        // Initialize counters
        updateTitleCounter();
        updateContentCounter();
        
        // Form submission
        const editForm = document.getElementById('editForm');
        const loadingOverlay = document.getElementById('loadingOverlay');
        
        editForm.addEventListener('submit', function(e) {
            const submitBtn = this.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            
            // Show loading
            loadingOverlay.classList.add('show');
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Updating...';
            submitBtn.disabled = true;
            
            // Re-enable after 5 seconds (in case of error)
            setTimeout(() => {
                loadingOverlay.classList.remove('show');
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }, 5000);
        });
        
        // Auto-save draft (optional feature)
        let autoSaveTimeout;
        
        function autoSave() {
            clearTimeout(autoSaveTimeout);
            autoSaveTimeout = setTimeout(() => {
                // Save to localStorage as draft
                const draft = {
                    title: titleInput.value,
                    content: contentInput.value,
                    category: document.getElementById('category').value,
                    tags: document.getElementById('tags').value,
                    timestamp: new Date().toISOString()
                };
                localStorage.setItem('articleDraft', JSON.stringify(draft));
                console.log('Draft saved');
            }, 2000);
        }
        
        // Load draft if exists
        const savedDraft = localStorage.getItem('articleDraft');
        if (savedDraft) {
            const draft = JSON.parse(savedDraft);
            if (confirm('A saved draft was found. Would you like to load it?')) {
                titleInput.value = draft.title;
                contentInput.value = draft.content;
                document.getElementById('category').value = draft.category;
                document.getElementById('tags').value = draft.tags;
                updateTitleCounter();
                updateContentCounter();
                updatePreview();
            }
        }
        
        // Auto-save on input
        titleInput.addEventListener('input', autoSave);
        contentInput.addEventListener('input', autoSave);
        
        // Clear draft on successful submit
        editForm.addEventListener('submit', function() {
            localStorage.removeItem('articleDraft');
        });
        
        // Add smooth animations to form elements
        document.querySelectorAll('.form-control, .form-select').forEach(element => {
            element.addEventListener('focus', function() {
                this.style.transform = 'scale(1.02)';
                this.style.boxShadow = '0 0 0 3px rgba(46, 125, 50, 0.1)';
            });
            
            element.addEventListener('blur', function() {
                this.style.transform = 'scale(1)';
                this.style.boxShadow = '';
            });
        });
    </script>
</body>
</html>
