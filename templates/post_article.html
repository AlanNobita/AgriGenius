<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a New Article - AgriGenius</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .post-form {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 2rem;
            box-shadow: var(--shadow-lg);
            border: 2px solid var(--border-color);
            transition: all 0.3s ease;
        }
        
        .post-form:hover {
            border-color: var(--primary-green);
            box-shadow: var(--shadow-xl);
        }
        
        .form-control, .form-select {
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            transition: all 0.3s ease;
            background: var(--bg-primary);
        }
        
        .form-control:focus, .form-select:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1);
            background: var(--bg-primary);
        }
        
        .btn-primary {
            background: var(--gradient-primary);
            border: none;
            border-radius: var(--radius-md);
            padding: 0.75rem 2rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }
        
        .btn-secondary {
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            color: var(--text-primary);
            border-radius: var(--radius-md);
            padding: 0.75rem 2rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-secondary:hover {
            background: var(--border-color);
            transform: translateY(-2px);
        }
        
        .form-label {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }
        
        .char-counter {
            font-size: 0.875rem;
            color: var(--text-muted);
            text-align: right;
        }
        
        .char-counter.warning {
            color: #f59e0b;
        }
        
        .char-counter.danger {
            color: #ef4444;
        }
        
        .upload-section {
            background: var(--bg-card);
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
            margin-bottom: 1rem;
        }
        
        .upload-section:hover {
            border-color: var(--primary-green);
            background: var(--bg-tertiary);
        }
        
        .upload-label {
            display: block;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            cursor: pointer;
        }
        
        .upload-section input[type="file"] {
            margin-bottom: 0.5rem;
        }
        
        .upload-section .form-text {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        
        .preview-section {
            background: var(--bg-secondary);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            margin-top: 1rem;
            border: 2px solid var(--border-color);
        }
        
        .preview-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 1rem;
        }
        
        .preview-content {
            color: var(--text-secondary);
            line-height: 1.6;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        
        .loading-overlay.show {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body>
    {% include 'navbar.html' %}
    
    <div class="container mt-4 animate-fadeInUp">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="post-form">
                    <div class="d-flex align-items-center mb-4">
                        <i class="fas fa-edit text-primary me-2"></i>
                        <h2 class="mb-0">Write New Article</h2>
                    </div>
                    
                    <form method="POST" id="postForm" enctype="multipart/form-data">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                        <div class="mb-3">
                            <label for="title" class="form-label">Title</label>
                            <input type="text" class="form-control" id="title" name="title" required maxlength="200">
                            <div class="char-counter" id="titleCounter">0/200</div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="category" class="form-label">Category</label>
                            <select class="form-select" id="category" name="category">
                                <option value="General">General</option>
                                <option value="Crops">Crops</option>
                                <option value="Soil">Soil</option>
                                <option value="Pests">Pests</option>
                                <option value="Technology">Technology</option>
                                <option value="Equipment">Equipment</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label for="tags" class="form-label">Tags (comma-separated)</label>
                            <input type="text" class="form-control" id="tags" name="tags" placeholder="e.g., irrigation, organic, sustainable">
                            <small class="form-text text-muted">Separate multiple tags with commas</small>
                        </div>
                        
                        <div class="mb-3">
                            <label for="content" class="form-label">Content</label>
                            <textarea class="form-control" id="content" name="content" rows="12" required placeholder="Write your article here..."></textarea>
                            <div class="char-counter" id="contentCounter">0 characters</div>
                        </div>
                        
                        <!-- File Upload Section -->
                        <div class="mb-4">
                            <label class="form-label">Media Files (Optional)</label>
                            <div class="row">
                                <div class="col-md-4">
                                    <div class="upload-section">
                                        <label for="image" class="upload-label">
                                            <i class="fas fa-image me-2"></i>
                                            Upload Image
                                        </label>
                                        <input type="file" class="form-control" id="image" name="image" accept="image/*">
                                        <small class="form-text text-muted">PNG, JPG, GIF (Max 10MB)</small>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="upload-section">
                                        <label for="video" class="upload-label">
                                            <i class="fas fa-video me-2"></i>
                                            Upload Video
                                        </label>
                                        <input type="file" class="form-control" id="video" name="video" accept="video/*">
                                        <small class="form-text text-muted">MP4, AVI, MOV (Max 50MB)</small>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="upload-section">
                                        <label for="audio" class="upload-label">
                                            <i class="fas fa-microphone me-2"></i>
                                            Upload Audio
                                        </label>
                                        <input type="file" class="form-control" id="audio" name="audio" accept="audio/*">
                                        <small class="form-text text-muted">MP3, WAV, OGG (Max 50MB)</small>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Preview Section -->
                        <div class="preview-section">
                            <h5 class="mb-3">
                                <i class="fas fa-eye me-2"></i>
                                Preview
                            </h5>
                            <div class="preview-title" id="previewTitle">Your article title...</div>
                            <div class="preview-content" id="previewContent">Your article content...</div>
                        </div>
                        
                        <div class="d-flex gap-3 mt-4">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-paper-plane me-2"></i>
                                Publish Article
                            </button>
                            <a href="/articles" class="btn btn-secondary">
                                <i class="fas fa-arrow-left me-2"></i>
                                Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="text-center text-white">
            <div class="loading-spinner mb-3"></div>
            <p>Publishing article...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Character counters
        const titleInput = document.getElementById('title');
        const contentInput = document.getElementById('content');
        const titleCounter = document.getElementById('titleCounter');
        const contentCounter = document.getElementById('contentCounter');
        const previewTitle = document.getElementById('previewTitle');
        const previewContent = document.getElementById('previewContent');
        
        function updateTitleCounter() {
            const length = titleInput.value.length;
            titleCounter.textContent = `${length}/200`;
            titleCounter.className = 'char-counter';
            
            if (length > 180) {
                titleCounter.classList.add('warning');
            }
            if (length > 200) {
                titleCounter.classList.add('danger');
            }
        }
        
        function updateContentCounter() {
            const length = contentInput.value.length;
            contentCounter.textContent = `${length} characters`;
            contentCounter.className = 'char-counter';
            
            if (length > 1000) {
                contentCounter.classList.add('warning');
            }
            if (length > 2000) {
                contentCounter.classList.add('danger');
            }
        }
        
        function updatePreview() {
            previewTitle.textContent = titleInput.value || 'Your article title...';
            previewContent.textContent = contentInput.value || 'Your article content...';
        }
        
        // Event listeners
        titleInput.addEventListener('input', () => {
            updateTitleCounter();
            updatePreview();
        });
        
        contentInput.addEventListener('input', () => {
            updateContentCounter();
            updatePreview();
        });
        
        // Initialize counters
        updateTitleCounter();
        updateContentCounter();
        
        // Form submission
        const postForm = document.getElementById('postForm');
        const loadingOverlay = document.getElementById('loadingOverlay');
        
        postForm.addEventListener('submit', function(e) {
            e.preventDefault(); // Prevent default form submission
            
            // Basic validation
            const title = document.getElementById('title').value.trim();
            const content = document.getElementById('content').value.trim();
            
            if (!title) {
                alert('Please enter a title for your article.');
                document.getElementById('title').focus();
                return;
            }
            
            if (!content) {
                alert('Please enter content for your article.');
                document.getElementById('content').focus();
                return;
            }
            
            if (content.length < 10) {
                alert('Article content must be at least 10 characters long.');
                document.getElementById('content').focus();
                return;
            }
            
            const submitBtn = this.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            
            // Show loading
            loadingOverlay.classList.add('show');
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Publishing...';
            submitBtn.disabled = true;
            
            // Submit the form
            this.submit();
        });
        
        // Auto-save draft (optional feature)
        let autoSaveTimeout;
        
        function autoSave() {
            clearTimeout(autoSaveTimeout);
            autoSaveTimeout = setTimeout(() => {
                // Save to localStorage as draft
                const draft = {
                    title: titleInput.value,
                    content: contentInput.value,
                    category: document.getElementById('category').value,
                    tags: document.getElementById('tags').value,
                    timestamp: new Date().toISOString()
                };
                localStorage.setItem('articleDraft', JSON.stringify(draft));
                console.log('Draft saved');
            }, 2000);
        }
        
        // Load draft if exists
        const savedDraft = localStorage.getItem('articleDraft');
        if (savedDraft) {
            const draft = JSON.parse(savedDraft);
            if (confirm('A saved draft was found. Would you like to load it?')) {
                titleInput.value = draft.title;
                contentInput.value = draft.content;
                document.getElementById('category').value = draft.category;
                document.getElementById('tags').value = draft.tags;
                updateTitleCounter();
                updateContentCounter();
                updatePreview();
            }
        }
        
        // Auto-save on input
        titleInput.addEventListener('input', autoSave);
        contentInput.addEventListener('input', autoSave);
        
        // Clear draft on successful submit
        postForm.addEventListener('submit', function() {
            localStorage.removeItem('articleDraft');
        });
        
        // Add smooth animations to form elements
        document.querySelectorAll('.form-control, .form-select').forEach(element => {
            element.addEventListener('focus', function() {
                this.style.transform = 'scale(1.02)';
                this.style.boxShadow = '0 0 0 3px rgba(46, 125, 50, 0.1)';
            });
            
            element.addEventListener('blur', function() {
                this.style.transform = 'scale(1)';
                this.style.boxShadow = '';
            });
        });
    </script>
</body>
</html>
