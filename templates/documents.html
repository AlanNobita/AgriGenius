<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documents Manager - AgriGenius</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% include 'navbar.html' %}

    <section class="py-5">
        <div class="container">
            <div class="row">
                <div class="col-lg-6">
                    <div class="card card-enhanced">
                        <div class="card-header">
                            <h5 class="mb-0">Upload PDF to Knowledge Base</h5>
                        </div>
                        <div class="card-body">
                            <form id="uploadForm" class="d-flex align-items-center gap-2" enctype="multipart/form-data">
                                <input class="form-control" type="file" id="pdfInput" accept="application/pdf">
                                <button class="btn btn-primary" type="submit">Upload</button>
                            </form>
                            <div class="mt-3" id="uploadStatus" aria-live="polite"></div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-6">
                    <div class="card card-enhanced">
                        <div class="card-header">
                            <h5 class="mb-0">Existing PDFs</h5>
                        </div>
                        <div class="card-body">
                            {% if pdfs and pdfs|length %}
                            <ul class="list-group">
                                {% for p in pdfs %}
                                <li class="list-group-item d-flex justify-content-between align-items-center">
                                    <span class="text-truncate" style="max-width: 70%;">{{ p.name }}</span>
                                    <a class="btn btn-sm btn-outline-primary" href="{{ p.path }}" target="_blank">View</a>
                                </li>
                                {% endfor %}
                            </ul>
                            {% else %}
                            <div class="empty-state">
                                <i class="fas fa-file-pdf"></i>
                                <h4>No PDFs yet</h4>
                                <p>Upload PDFs to build your RAG knowledge base.</p>
                            </div>
                            {% endif %}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const input = document.getElementById('pdfInput');
            const statusEl = document.getElementById('uploadStatus');
            if (!input.files || !input.files[0]) {
                statusEl.textContent = 'Please select a PDF file.';
                statusEl.className = 'text-danger';
                return;
            }
            const form = new FormData();
            form.append('pdf', input.files[0]);
            statusEl.textContent = 'Uploading...';
            statusEl.className = 'text-muted';
            try {
                const res = await fetch('/rag/api/upload_pdf', { method: 'POST', body: form, credentials: 'same-origin' });
                const ct = res.headers.get('content-type') || '';
                let data;
                if (ct.includes('application/json')) {
                    data = await res.json();
                } else {
                    const text = await res.text();
                    throw new Error(`Non-JSON response (${res.status}): ${text.slice(0,300)}`);
                }
                if (!res.ok || data.error) throw new Error(data.error || `Upload failed (${res.status})`);
                statusEl.textContent = `Uploaded ${input.files[0].name}. Ingested ${data.chunks} chunks.`;
                statusEl.className = 'text-success';
                setTimeout(() => window.location.reload(), 800);
            } catch (err) {
                statusEl.textContent = 'Upload failed. ' + (err.message || '');
                statusEl.className = 'text-danger';
            }
        });
    </script>
</body>
<\/html>
