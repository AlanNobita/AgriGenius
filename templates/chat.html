<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriGenius - AI Assistant</title>
    <meta name="description" content="Get instant agricultural advice from our AI-powered assistant">
    
    <!-- External Stylesheets -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Main AgriGenius Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <!-- Chat-specific CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.prod.css') }}?v=1.0.1">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/gemini-chatbot-logo.svg') }}">
    
    <!-- Preconnect for CDNs to speed up asset loading -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    
    <!-- Content Security Policy (minimal, adjust server-side as needed) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; img-src 'self' data: https:; script-src 'self' 'unsafe-inline' 'unsafe-hashes' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src https://cdnjs.cloudflare.com https://fonts.gstatic.com data:;">
    
    <!-- Additional CSS for enhanced chat styling -->
    <style>
        /* General Body and Theme */
        body {
            font-family: 'Roboto', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        .dark-theme {
            background-color: #121212;
            color: #e0e0e0;
        }

        .dark-theme .chat-sidebar,
        .dark-theme .chat-container,
        .dark-theme .offcanvas-body {
            background-color: #1e1e1e;
            border-color: #333 !important;
        }

        .dark-theme .form-control,
        .dark-theme .btn-outline-secondary {
            background-color: #2a2a2a;
            color: #e0e0e0;
            border-color: #444;
        }

        .dark-theme .btn-close {
            filter: invert(1);
        }

        /* Layout */
        main.container-fluid {
            height: calc(100vh - 56px); /* Adjust 56px based on header height */
        }

        /* Sidebar */
        .chat-sidebar {
            background-color: #f8f9fa;
            border-right: 1px solid #dee2e6;
            display: flex;
            flex-direction: column;
        }

        #conversation-list .list-group-item {
            cursor: pointer;
        }

        #conversation-list .list-group-item.active {
            background-color: #0d6efd;
            color: white;
        }

        /* Chat Area */
        .chat-container {
            background-color: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 0.5rem;
        }

        #chat-window {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* Chat Bubbles */
        .message {
            display: flex;
            align-items: flex-start;
            max-width: 80%;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #0d6efd;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin: 0 10px;
        }

        .message.assistant .avatar {
            background-color: #6c757d;
        }

        .message .text-bubble {
            padding: 10px 15px;
            border-radius: 15px;
            background-color: #f1f1f1;
        }

        .message.user .text-bubble {
            background-color: #0d6efd;
            color: white;
        }

        /* Suggestions Bar */
        #suggestions-bar {
            display: flex;
            gap: 10px;
            overflow-x: auto;
        }

        .suggestion-card {
            flex: 0 0 auto;
            cursor: pointer;
        }

        /* Input Form */
        .chat-input {
            resize: none;
        }

        .send-btn {
            background-color: #0d6efd;
            color: white;
        }
    </style>
</head>
<body>
    <!-- Main Application Header -->
    {% include 'navbar.html' %}

    <main class="container-fluid mt-4">
        <div class="row g-0 vh-100">
            <!-- Left Sidebar for Conversations and AI Modes -->
            <aside class="col-lg-2 d-none d-lg-flex flex-column p-3">
                <div class="chat-sidebar h-100">
                    <div class="ai-modes-section">
                        <div class="ai-modes-header">
                            <h5 class="ai-modes-title">
                                <i class="fas fa-robot"></i>
                                AI Modes
                            </h5>
                            <div class="current-mode-indicator" id="current-mode-indicator" style="display: none;">
                                <i class="fas fa-circle"></i>
                                <span id="current-mode-name">Assist</span>
                            </div>
                        </div>
                        <div id="ai-modes-list" class="ai-modes-list">
                            <!-- AI modes will be loaded here dynamically -->
                        </div>
                    </div>
                    <div class="p-3 border-bottom">
                        <h5 class="mb-0">Conversations</h5>
                        <button id="new-chat-btn" class="btn btn-primary w-100 mt-2">New Chat</button>
                    </div>
                    <div id="conversation-list" class="flex-grow-1 overflow-auto p-3"></div>
                    <div class="p-3 border-top">
                        <div class="d-flex align-items-center">
                            <i class="fas fa-user-circle fs-3 me-2"></i>
                            <span class="fw-bold">{{ current_user.username if current_user.is_authenticated else 'Guest' }}</span>
                        </div>
                        <button id="theme-toggle" class="btn btn-outline-secondary w-100 mt-2">Toggle Theme</button>
                        {% if current_user.is_authenticated %}
                            <a href="{{ url_for('logout') }}" class="btn btn-danger w-100 mt-2">Logout</a>
                        {% endif %}
                    </div>
                </div>
            </aside>

            <!-- Main Chat Area -->
            <div class="col-lg-10 col-12 d-flex flex-column p-3">
                <div class="chat-container d-flex flex-column flex-grow-1">
                    <div id="chat-header" class="p-3 border-bottom d-flex justify-content-between align-items-center">
                        <h5 id="chat-title" class="mb-0">New Chat</h5>
                        <div class="d-lg-none">
                            <button class="btn btn-outline-secondary" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasSidebar" aria-controls="offcanvasSidebar">
                                <i class="fas fa-bars"></i>
                            </button>
                        </div>
                    </div>

                    <div id="chat-window" class="flex-grow-1 p-4 overflow-auto"></div>

                    <div id="suggestions-bar" class="p-3 border-top"></div>

                    <div class="p-3 border-top">
                        <div id="chat-form" class="d-flex align-items-center">
                            <button id="upload-btn" class="btn btn-outline-secondary me-2" aria-label="Upload File" type="button">
                                <i class="fas fa-paperclip"></i>
                            </button>
                            <textarea id="chat-input" class="form-control chat-input flex-grow-1" placeholder="Ask me anything about agriculture..." rows="1"></textarea>
                            <button id="send-btn" class="btn send-btn ms-2" aria-label="Send Message" type="button">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>
                        <div id="upload-preview" class="mt-2"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Offcanvas Sidebar for Mobile -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasSidebar" aria-labelledby="offcanvasSidebarLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasSidebarLabel">Conversations</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <div id="mobile-conversation-list"></div>
        </div>
    </div>

    <!-- External Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    
    <!-- Main Chat Logic -->
    <script src="{{ url_for('static', filename='js/chat.js') }}?v=1.0.1"></script>
</body>
</html>
