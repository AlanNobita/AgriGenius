<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmGenius - Articles</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
{% include 'navbar.html' %}
<div class="container mt-4">
    <h2>Public Articles</h2>
    <a href="/post_article" class="btn btn-success mb-3">Post a New Article</a>
    <hr>
    <h3>All Articles</h3>
    {% for article in articles %}
        <div class="card mb-3">
            <div class="card-body">
                <div class="mb-2">
                    <span style="font-weight: bold; font-size: 1.25rem;">
                        Posted by <a href="/user/{{ article.author.id }}">{{ article.author.username|capitalize }}</a>
                    </span>
                </div>
                <h5 class="card-title">{{ article.title }}</h5>
                <p class="card-text">{{ article.content }}</p>
            </div>
        </div>
    {% endfor %}
</div>
</body>
</html>
